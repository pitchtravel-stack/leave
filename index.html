<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบบันทึกวันลา รพ.ร้องกวาง</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root{--blue:#1E7FD8;--blue-d:#145EA8;--blue-l:#E6F1FC;--blue-ll:#F2F8FE;--bg:#F3F5F8;--line:#E1E6ED;--line2:#EDF0F4;--text:#1E2A38;--muted:#667487;--muted2:#94A0B0;
--sick:#3E8EDE;--biz:#E0A030;--vac:#2FA37A;--mat:#D2669A;--pat:#7B6FD6;--ord:#8C7A5B;--oth:#8A96A6;--danger:#D64545;--ok:#2F855A;--r:12px;--shadow:0 1px 2px rgba(20,40,70,.06),0 2px 8px rgba(20,40,70,.05)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#2B8BE6,#145EA8);display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:none}
.brand b{display:block;font-size:15px;line-height:1.2}.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:#3A4757;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--blue-ll)}.nav.on{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.sfoot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;background:var(--bg);border-radius:10px;line-height:1.7}
.sfoot b{color:var(--text)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(243,245,248,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;font-weight:700;flex:1;min-width:150px}
.ver{font-size:11px;background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:1px 8px;margin-left:6px;font-weight:500;vertical-align:middle}
.sel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:6px 10px;height:36px}
.user{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 12px;font-size:13px;max-width:100%}
.user .em{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rolebadge{border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.rb-hr{background:var(--blue);color:#fff}.rb-view{background:var(--blue-l);color:var(--blue-d)}
.content{padding:20px 22px 110px;max-width:1280px}
.banner{border-radius:10px;padding:8px 12px;font-size:13.5px;margin-bottom:16px;background:var(--blue-l);border:1px solid #C9DFF6;color:var(--blue-d);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:28px;font-weight:700;line-height:1.2;margin-top:2px}.kpi .s{font-size:12.5px;color:var(--muted2)}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
h2{font-size:16px;margin:0 0 12px;font-weight:700}h3{font-size:14.5px;margin:0 0 8px}
.two{grid-template-columns:1.5fr 1fr}
.muted{color:var(--muted)}.small{font-size:13px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px 0 38px;background:#fff;font-size:15px}
.search svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--muted2)}
input:focus,select:focus,textarea:focus{outline:2px solid #B9D8F6;border-color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13.5px;color:#455366}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{background:var(--blue-ll)}.btn:disabled{opacity:.55;cursor:wait}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:var(--blue-d)}
.btn.dan{color:var(--danger)}.btn.sm{padding:3px 10px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:9px 10px;border-bottom:1px solid var(--line);background:#F8FAFC;position:sticky;top:0;z-index:1}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--blue-ll)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .grp td{background:#F3F7FC;font-weight:600;color:var(--blue-d);font-size:13px}
.scroll{overflow:auto;max-height:68vh;border-radius:var(--r)}
.tag{display:inline-block;padding:1px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bar{height:6px;background:#EDF1F5;border-radius:6px;overflow:hidden;min-width:60px}.bar i{display:block;height:100%;border-radius:6px}
.mini{display:flex;flex-direction:column;gap:3px;min-width:92px}.mini span{font-size:12.5px;color:var(--muted)}.mini b{color:var(--text);font-weight:600}
.empty{padding:30px;text-align:center;color:var(--muted)}
.chart{display:flex;gap:6px;align-items:flex-end;height:170px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.stack{width:70%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;background:#F0F3F7}
.col small{font-size:11px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.list .it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer}.list .it:last-child{border:0}
.av{width:34px;height:34px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.fab{position:fixed;right:24px;bottom:24px;z-index:30;background:var(--blue);color:#fff;border:0;border-radius:30px;padding:13px 20px;font-weight:600;box-shadow:0 6px 18px rgba(30,127,216,.35);cursor:pointer;display:flex;gap:8px;align-items:center;font-size:15px}
.ov{position:fixed;inset:0;background:rgba(20,32,48,.38);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(640px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2;gap:10px}
.mh h2{margin:0}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;flex:none}
.mb{padding:18px 20px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(520px,100%);background:#fff;z-index:51;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f label{font-size:13.5px;font-weight:600;color:#3A4757}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;cursor:pointer;font-size:13.5px;text-align:center}
.tbtn.on{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d);font-weight:600}
.combo{position:relative}
.opts{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:240px;overflow:auto;z-index:5;box-shadow:var(--shadow)}
.opts div{padding:8px 12px;cursor:pointer;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.opts div:hover,.opts div.hl{background:var(--blue-ll)}
.qbox{background:var(--blue-ll);border:1px solid #D3E6F8;border-radius:12px;padding:12px 14px;margin-bottom:14px}
.qbox .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.qbox .nums b{display:block;font-size:20px}.qbox .nums span{font-size:12px;color:var(--muted)}
.alert{border-radius:9px;padding:8px 12px;font-size:13.5px;margin-top:8px}
.alert.w{background:#FFF6E5;color:#8A5A0B;border:1px solid #F3DCAA}
.alert.e{background:#FDECEC;color:#9B2C2C;border:1px solid #F5C2C2}
.alert.i{background:#EAF5EF;color:#276749;border:1px solid #BFE3CD}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1E2A38;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;font-size:14px;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.err{background:var(--danger)}
.qt input{width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;text-align:right}
.qt input:disabled{background:transparent;border-color:transparent;color:var(--text)}
.bnav{display:none}.cards-m{display:none}
.mcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.mcard .h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.mcard .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#EAF3FD 0%,#F3F5F8 55%)}
.lbox{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(20,60,110,.08);width:min(400px,100%);padding:28px 26px}
.lbox .logo{width:52px;height:52px;font-size:24px;border-radius:14px;margin-bottom:12px}
.lbox h1{font-size:20px;margin:0}.lbox p{color:var(--muted);font-size:14px;margin:6px 0 18px}
.lbox input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:16px;margin-bottom:12px}
.lbox .btn{width:100%;height:46px;font-size:16px}
.otp{letter-spacing:10px;text-align:center;font-size:24px!important;font-weight:700}
.lerr{color:var(--danger);font-size:14px;min-height:20px;margin-bottom:6px}
.lfoot{text-align:center;color:var(--muted2);font-size:12px;margin-top:16px}
.link{color:var(--blue-d);cursor:pointer;background:none;border:0;padding:0;font-size:14px;text-decoration:underline}
.loading{position:fixed;inset:0;background:rgba(243,245,248,.75);z-index:90;display:grid;place-items:center}
.spin{width:38px;height:38px;border:4px solid var(--blue-l);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vchart{display:flex;gap:3px;align-items:flex-end;height:110px}
.vchart i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .dc{min-height:96px;border:1px solid var(--line2);border-radius:8px;padding:4px 5px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal .dc:hover{border-color:var(--blue)}
.cal .dc.off{background:#F6F7F9}.cal .dc.out{visibility:hidden}
.cal .dc.td{border:2px solid var(--blue)}
.cal .dn{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.cal .dn b{color:var(--text)}
.cal .dn .hn{font-size:10px;color:var(--danger);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:70%}
.cal .pp{font-size:11.5px;line-height:1.35;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .more{font-size:11px;color:var(--blue-d);font-weight:600}
.cal .cnt{display:none}
.rb-ex{background:#5B4BB7;color:#fff}
@media (max-width:860px){.cal{gap:2px}.cal .dc{min-height:58px;padding:3px}.cal .pp,.cal .more,.cal .dn .hn{display:none}
 .cal .cnt{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}.cal .cnt i{width:7px;height:7px;border-radius:50%}.cal .cnt b{font-size:11px;color:var(--blue-d)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.side{display:none}
  .top{padding:10px 14px}.top h1{font-size:17px}.user .em{max-width:120px}
  .content{padding:14px 14px 120px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);padding:5px 0;cursor:pointer}
  .bnav button.on{color:var(--blue-d);font-weight:600}.bnav svg{width:22px;height:22px}
  .fab{bottom:78px;right:16px;padding:12px 16px}
  .hide-m{display:none!important}.cards-m{display:block}
  .typegrid{grid-template-columns:repeat(2,1fr)}
  .ov{padding:0;align-items:flex-end}.modal{border-radius:16px 16px 0 0;max-height:94vh}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!-- LOGIN -->
<div class="login hidden" id="login">
  <div class="lbox">
    <div class="logo">ล</div>
    <h1>ระบบบันทึกวันลา</h1>
    <p>โรงพยาบาลร้องกวาง จังหวัดแพร่</p>
    <div id="lstep"></div>
    <div class="lfoot" id="lfoot"></div>
  </div>
</div>
<!-- APP -->
<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand"><div class="logo">ล</div><div><b>ระบบบันทึกวันลา</b><small>โรงพยาบาลร้องกวาง</small></div></div>
    <div id="sidenav"></div>
    <div class="sfoot" id="sfoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="ttl"></h1>
      <select class="sel" id="fy" aria-label="ปีงบประมาณ"></select>
      <div class="user" id="user"></div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>
<nav class="bnav hidden" id="bnav"></nav>
<button class="fab hidden" id="fab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>บันทึกการลา</button>
<div id="layer"></div>
<div class="loading hidden" id="loading"><div class="spin"></div></div>

<script>
const VERSION='1.7.2';
/* ⚙️ ใส่ URL ของ web app (ลงท้าย /exec) จาก Deploy > Manage deployments */
const API_URL='https://script.google.com/macros/s/AKfycbxTmqnlyvAXsr7m8faN-o7yGal6rtot9Jg2O-_WrsHbyO8fceo_54c368lItwiefOHMTw/exec';
document.getElementById('lfoot').textContent='เวอร์ชัน '+VERSION;
/* ===================== constants ===================== */
const GROUPS={gov:'ข้าราชการ',perm:'ลูกจ้างประจำ',moph:'พกส.',pgr:'พนักงานราชการ',temp:'ลูกจ้างชั่วคราว'};
const TYPES=[{k:'sick',n:'ลาป่วย',c:'var(--sick)',unit:'work'},{k:'biz',n:'ลากิจส่วนตัว',c:'var(--biz)',unit:'work'},{k:'vac',n:'ลาพักผ่อน',c:'var(--vac)',unit:'work'},{k:'mat',n:'ลาคลอดบุตร',c:'var(--mat)',unit:'cal'},{k:'pat',n:'ลาช่วยภริยาคลอด',c:'var(--pat)',unit:'work'},{k:'ord',n:'ลาอุปสมบท/ฮัจย์',c:'var(--ord)',unit:'cal'},{k:'oth',n:'ลาอื่น ๆ',c:'var(--oth)',unit:'work'}];
const T=Object.fromEntries(TYPES.map(t=>[t.k,t]));
const STATUS={active:'ปฏิบัติงาน',retired:'เกษียณ',resigned:'ลาออก/พ้นสภาพ'};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const DEVICE=/iPad|Macintosh.*Mobile|Tablet/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1)?'iPad/Tablet':/Mobi|Android|iPhone/i.test(navigator.userAgent)?'มือถือ':'PC';

/* ===================== state ===================== */
const S={cm:null,cg:'all',cd:'all',ct:'all',cq:'',view:'dash',fy:null,q:'',grp:'all',hq:'',ht:'all',hm:'all',mm:null,showAll:false,sort:'name',lq:''};
let D=null, USER=null, STATS=null, TOKEN=null, SBY={}, _u=null, ADMIN=null, LOGS=null;

/* ===================== helpers ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||isNaN(n)?'–':(Math.round(n*10)/10).toLocaleString('th-TH'));
const d2=iso=>new Date(iso+'T00:00:00');
const thd=iso=>iso?d2(iso).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'}):'–';
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fyOf=iso=>{const d=d2(iso);return String(d.getFullYear()+543+(d.getMonth()>=9?1:0));};
const fyMonths=fy=>{const y=+fy-544,a=[];for(let i=0;i<12;i++){const m=(9+i)%12,yy=y+(9+i>=12?1:0);a.push(yy+'-'+String(m+1).padStart(2,'0'));}return a;};
const mName=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('th-TH',{month:'short'});};
const mLong=k=>{const[y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('th-TH',{month:'long',year:'numeric'});};
const today=ymd(new Date());
const initials=n=>String(n).replace(/^(นางสาว|น\.ส\.|นาง|นาย|ดร\.|นพ\.|พญ\.)\s*/,'').trim().charAt(0);
const plain=n=>String(n).replace(/^(นางสาว|น\.ส\.|นาง|นาย)\s*/,'');
const isHR=()=>USER&&USER.role==='hr';
const isExec=()=>USER&&USER.role==='exec';
const canCal=()=>isHR()||isExec();
/* v1.7.0 โหมดส่วนตัว: เจ้าหน้าที่ทั่วไปเห็นเฉพาะการลาของตนเอง (ภาพรวมใช้ยอดสรุปจาก server) */
const PRIV=()=>!!USER&&!canCal();
const mine=s=>!PRIV()||String(s.id)===String(USER.staffId);
const pinAcct=()=>USER&&(USER.isHrAccount||USER.isExecAccount);
const active=s=>!/retired|resigned|เกษียณ|ลาออก/i.test(s.status||'');

/* ===================== server call ===================== */
/* เปิดจาก Apps Script → ใช้ google.script.run | เปิดจาก server ภายนอก → fetch JSON API (ไม่ผูกบัญชี Google ในเบราว์เซอร์) */
const VIA_GAS=typeof google!=='undefined'&&!!(google.script&&google.script.run);
function callServer(fn,args){
  if(VIA_GAS)return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e&&e.message||'เชื่อมต่อไม่สำเร็จ')))[fn](...args));
  return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})
    .catch(()=>{throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่')})
    .then(r=>{if(!r.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด ('+r.status+')');return r.text()})
    .then(t=>{try{return JSON.parse(t)}catch(e){throw new Error('ระบบตอบกลับไม่ถูกต้อง — ตรวจสอบ API_URL และการ Deploy (Anyone)')}});
}
function api(fn,...args){
  return callServer(fn,args).then(r=>{
    if(r&&r.ok===false){
      if(r.error==='AUTH'){logout(true);throw new Error('กรุณาเข้าสู่ระบบใหม่');}
      throw new Error(r.error);
    }
    return r;
  });
}
async function run(fn,...args){busy(true);try{return await api(fn,...args);}catch(e){toast(e.message,true);throw e;}finally{busy(false);}}

/* ===================== business rules ===================== */
function workDays(a,b,unit){
  if(!a||!b||b<a)return 0;const hol=new Set(D.holidays.map(h=>h[0]));let n=0;
  for(let d=d2(a);ymd(d)<=b;d.setDate(d.getDate()+1)){if(unit==='cal'){n++;continue}const w=d.getDay();if(w===0||w===6||hol.has(ymd(d)))continue;n++;}
  return n;
}
const firstYear=(s,fy)=>!!s.start&&s.start>((+fy-545)+'-10-01');
function qcfg(s,type){return (D.quota[s.group]||{})[type]||null;}
function quota(s,type,fy){
  const q=qcfg(s,type);
  if(type==='vac'){const v=D.vac[s.id];return v!=null?v:(q?q.days:null);}
  if(!q||q.days==null)return null;
  if(q.first!=null&&firstYear(s,fy))return q.first;
  return q.days;
}
function monthsServed(s,at){if(!s.start)return 999;const a=d2(s.start),b=d2(at);return(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())-(b.getDate()<a.getDate()?1:0);}
function usage(sid,excl){const u={};TYPES.forEach(t=>u[t.k]=0);D.leaves.forEach(r=>{if(r.sid===sid&&r.id!==excl)u[r.type]+=r.days});return u;}
function allUsage(){if(_u)return _u;const m={};D.staff.forEach(s=>{m[s.id]={};TYPES.forEach(t=>m[s.id][t.k]=0)});D.leaves.forEach(r=>{if(m[r.sid])m[r.sid][r.type]+=r.days});return _u=m;}
function mkSummary(L){const t=today,o={count:L.length,days:0,people:new Set(L.map(r=>r.sid)).size,today:0,todayIds:[],byM:{},byT:{}};
  L.forEach(r=>{const v=+r.days||0,m=r.start.slice(0,7);o.days+=v;if(r.start<=t&&r.end>=t){o.today++;o.todayIds.push(r.sid);}(o.byM[m]=o.byM[m]||{})[r.type]=(o.byM[m][r.type]||0)+v;o.byT[r.type]=(o.byT[r.type]||0)+v;});return o;}
function setData(d){
  if(PRIV()){if(!d.summary)d.summary=mkSummary(d.leaves||[]);const me=String(USER.staffId||'');d.leaves=(d.leaves||[]).filter(r=>String(r.sid)===me);}
  else d.summary=null;
  D=d;S.fy=d.fy;SBY=Object.fromEntries(d.staff.map(s=>[s.id,s]));_u=null;
  $('#fy').innerHTML=d.fyList.map(f=>`<option value="${f}" ${f===d.fy?'selected':''}>ปีงบประมาณ ${f}</option>`).join('');
  $('#fy').disabled=d.fyList.length<2;$('#fy').title=d.restricted?'ข้อมูลปีงบก่อนหน้า กรุณาติดต่องานการเจ้าหน้าที่ (HR)':'';}

function calMap(m){
  const hol=new Set(D.holidays.map(h=>h[0])),q=S.cq.trim().toLowerCase(),out={},a0=m+'-01',a1=m+'-31';
  D.leaves.forEach(r=>{

    const s=SBY[r.sid];if(!s)return;if(S.cg!=='all'&&s.group!==S.cg)return;if(S.cd!=='all'&&s.dept!==S.cd)return;if(q&&!s.name.toLowerCase().includes(q))return;

      const iso=ymd(d),w=d.getDay();if(t.unit!=='cal'&&(w===0||w===6||hol.has(iso)))continue;(out[iso]=out[iso]||[]).push({r,s});}

   <div class="row2"><div class="f"><label>เลขที่ใบลา / เลขรับ</label><input id="fdoc" value="${esc(ed?ed.doc:'')}" placeholder="เช่น ลป.123/2570"></div><div class="f"><label>หมายเหตุ</label><input id="fnote" value="${esc(ed?ed.note:'')}" placeholder="ไม่บังคับ"></div></div>`,
   `<button class="btn" id="fcancel">ยกเลิก</button><button class="btn pri" id="fsave">${ed?'บันทึกการแก้ไข':'บันทึก'}</button>`);
  $('#fh').value=ed?ed.half:'';
  const fs=$('#fs'),op=$('#fopts');let hl=0,cur=[];
  const showOpts=()=>{const q=fs.value.trim().toLowerCase();cur=D.staff.filter(s=>active(s)&&(!q||s.name.toLowerCase().includes(q)||s.id.toLowerCase()===q)).slice(0,30);hl=0;
    op.innerHTML=cur.map((s,i)=>`<div data-i="${i}" class="${i===0?'hl':''}"><span>${esc(s.name)}</span><span class="small muted">${(GROUPS[s.group]||'').split('/')[0]}</span></div>`).join('')||'<div class="muted">ไม่พบชื่อ</div>';op.classList.remove('hidden');
    op.querySelectorAll('[data-i]').forEach(d=>d.onmousedown=e=>{e.preventDefault();pick(cur[+d.dataset.i])});};
  const pick=s=>{F.sid=s.id;fs.value=s.name;op.classList.add('hidden');calc();};
  fs.oninput=()=>{F.sid='';showOpts();calc()};fs.onfocus=showOpts;fs.onblur=()=>setTimeout(()=>op.classList.add('hidden'),150);
  fs.onkeydown=e=>{const it=op.querySelectorAll('[data-i]');if(!it.length)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();hl=(hl+(e.key==='ArrowDown'?1:-1)+it.length)%it.length;it.forEach((d,i)=>d.classList.toggle('hl',i===hl))}if(e.key==='Enter'&&cur[hl]){e.preventDefault();pick(cur[hl])}};
  $('#ftype').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{F.type=b.dataset.t;$('#ftype').querySelectorAll('.tbtn').forEach(x=>x.classList.toggle('on',x===b));F.manual=false;calc();});

    const s=SBY[F.sid],fy=a?fyOf(a):S.fy,sameFy=fy===S.fy;

    if(F.type==='sick'&&days>=3)msgs.push(['i','ลาป่วยตั้งแต่ 3 วันขึ้นไป ต้องแนบใบรับรองแพทย์']);
    const ov=D.leaves.find(r=>r.sid===s.id&&r.id!==(ed&&ed.id)&&r.start<=b&&r.end>=a);
    if(ov)msgs.push(['w',`ช่วงวันซ้อนกับรายการเดิม: ${T[ov.type].n} ${thd(ov.start)}${ov.end!==ov.start?' – '+thd(ov.end):''}`]);
    $('#fq').innerHTML=`<div class="qbox"><div class="small" style="margin-bottom:8px"><b>${t.n}</b> · ปีงบ ${fy} · ${GROUPS[s.group]||''}</div>${sameFy?`<div class="nums"><div><span>สิทธิ์</span><b>${q??'–'}</b></div><div><span>ใช้ไปแล้ว</span><b>${fmt(u)}</b></div><div><span>ครั้งนี้</span><b style="color:var(--blue-d)">${fmt(days)}</b></div><div><span>คงเหลือ</span><b style="color:${q!=null&&q-u-days<0?'var(--danger)':'var(--ok)'}">${q!=null?fmt(q-u-days):'–'}</b></div></div>`:''}${msgs.map(m=>`<div class="alert ${m[0]}">${m[1]}</div>`).join('')}</div>`;
  }
  if(ed)$('#fd').value=ed.days;calc();
  $('#fcancel').onclick=closeLayer;
  $('#fsave').onclick=async()=>{
    const a=$('#fa').value,b=$('#fb').value,days=parseFloat($('#fd').value)||0;
    if(!F.sid){toast('กรุณาเลือกเจ้าหน้าที่',true);fs.focus();return}
    if(!a||!b||b<a){toast('กรุณาตรวจสอบวันที่',true);return}
    if(fyOf(a)!==fyOf(b)){toast('วันลาข้ามปีงบประมาณ กรุณาแยกรายการ',true);return}
    if(days<=0){toast('จำนวนวันต้องมากกว่า 0',true);return}
    const rec={id:ed?ed.id:'',sid:F.sid,type:F.type,start:a,end:b,days,half:$('#fh').value,doc:$('#fdoc').value.trim(),note:$('#fnote').value.trim()};
    $('#fsave').disabled=true;
    try{const r=await run('apiSaveLeave',TOKEN,rec);closeLayer();setData(r.data);render();toast(ed?'บันทึกการแก้ไขแล้ว':'บันทึกการลาเรียบร้อย');}
    catch(e){const b2=$('#fsave');if(b2)b2.disabled=false;}
  };
  if(!F.sid)setTimeout(()=>fs.focus(),50);
}

/* ===================== render ===================== */
async function reloadFy(fy){const r=await run('apiLoadFy',TOKEN,fy||S.fy);setData(r.data);S.hm='all';S.mm=null;S.cm=null;render();}
function render(){
  renderNav();const v=$('#view');
  if(S.view==='dash'){v.innerHTML=vDash();bindSid(v);}
  if(S.view==='staff'){v.innerHTML=vStaff();$('#sort').value=S.sort;renderStaffList();
    $('#q').oninput=e=>{S.q=e.target.value;renderStaffList()};$('#sort').onchange=e=>{S.sort=e.target.value;renderStaffList()};
    v.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.grp=b.dataset.g;v.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b));renderStaffList()});
    const a=$('#addStaff');if(a)a.onclick=()=>staffForm();}
  if(S.view==='hist'){v.innerHTML=vHist();renderHist();
    $('#hq').oninput=e=>{S.hq=e.target.value;renderHist()};$('#ht').onchange=e=>{S.ht=e.target.value;renderHist()};$('#hm').onchange=e=>{S.hm=e.target.value;renderHist()};}
  if(S.view==='cal'){v.innerHTML=vCal();renderCal();
    const ms=()=>{const m=fyMonths(S.fy);return m};
    $('#cm').onchange=e=>{S.cm=e.target.value;renderCal()};
    $('#cprev').onclick=()=>{const m=ms(),i=m.indexOf(S.cm);if(i>0){S.cm=m[i-1];$('#cm').value=S.cm;renderCal()}};
    $('#cnext').onclick=()=>{const m=ms(),i=m.indexOf(S.cm);if(i<m.length-1){S.cm=m[i+1];$('#cm').value=S.cm;renderCal()}};
    $('#cg').onchange=e=>{S.cg=e.target.value;renderCal()};$('#cd').onchange=e=>{S.cd=e.target.value;renderCal()};$('#ct').onchange=e=>{S.ct=e.target.value;renderCal()};
    $('#cq').oninput=e=>{S.cq=e.target.value;renderCal()};}
  if(S.view==='month'){v.innerHTML=vMonth();renderMonth();
    $('#mm').onchange=e=>{S.mm=e.target.value;renderMonth()};$('#showAll').onchange=e=>{S.showAll=e.target.checked;renderMonth()};$('#copyT').onclick=copyMonth;}
  if(S.view==='log'){v.innerHTML=vLog();renderLogs();if(!LOGS)loadLogs();
    $('#lq').oninput=e=>{S.lq=e.target.value;renderLogs()};$('#la').onchange=renderLogs;$('#lref').onclick=loadLogs;}
  if(S.view==='set'){v.innerHTML=vSet();
    v.querySelectorAll('[data-q]').forEach(i=>i.onchange=async()=>{const[g,k,f]=i.dataset.q.split('|');try{await run('apiSaveQuota',TOKEN,g,k,f,i.value.trim());const q=D.quota[g]=D.quota[g]||{};q[k]=q[k]||{};q[k][f]=i.value.trim()===''?null:+i.value;_u=null;toast('บันทึกสิทธิ์ '+GROUPS[g]+' แล้ว');}catch(e){}});
    v.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=async()=>{try{const r=await run('apiHoliday',TOKEN,'del',b.dataset.hdel,'');D.holidays=r.holidays;render();}catch(e){}});
    const ha=$('#hadd');if(ha)ha.onclick=async()=>{const d=$('#hd').value,n=$('#hn').value.trim();if(!d||!n){toast('ระบุวันที่และชื่อวันหยุด',true);return}try{const r=await run('apiHoliday',TOKEN,'add',d,n);D.holidays=r.holidays;render();toast('เพิ่มวันหยุดแล้ว');}catch(e){}};
    if(isHR())loadAdmin();}
  const bh=$('#bnHr');if(bh)bh.onclick=enterHr;
}
$('#fy').onchange=e=>reloadFy(e.target.value);
$('#fab').onclick=()=>openForm();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
start(LS.get('lv_hr')||LS.get('lv_view'));
</script>
</body>
</html>
